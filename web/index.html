<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="utf-8">
        <title>battleship</title>
        <link rel="stylesheet" href="/src/style.css">
    </head>
    <body>
        <header class="navbar">
            <h2 id="title">Battleship</h2>
            <div id="game-state"></div>
            <a href="#skill_issue" id="leave-link" hidden>Leave</a>
        </header>

        <main class="container"> 
            <section id="player-side" class="board-wrapper">
                    <div id="player-indicator" class="ship-indicator" hidden>indicator-placeholder</div>
                    <div id="player-area">
                        <div id="player-grid" class="board-grid"></div>
                        <div id="player-label" class="board-label">Your grid</div>
                    </div>
            </section>
            <section id="opponent-side" class="board-wrapper">
                    <!-- prematch-overlay stacking the ship-grids if state == prep, hide if isn't -->
                    <div id="opponent-area">
                        <div id="opponent-grid-wrapper">
                            <div id="prematch-overlay">
                                <div id="play-with">Play with ??</div>
                                <div id="match-options">
                                    <a href="#" id="random-link" class="link disabled" aria-disabled="true" title="well">random</a>
                                    <div id="or">or</div>
                                    <a href="#" id="friend-link" class="link" title="you have a friend?!">friend</a>
                                </div>
                                
                                <div id="have-friend" hidden>
                                    <div id="url-desc">send this link to your opponent</div>
                                    <div id="url-link">example.com/room/123xxxxxx</div>
                                </div>
                                <button id="match-button">Match</button>
                            </div>
                            <div id="opponent-grid" class="board-grid">
                            </div>
                        </div>
                        <div id="opponent-label" class="board-label">Opponent grid</div>
                    </div>
                    <div id="opponent-indicator" class="ship-indicator" hidden>indicator-placeholder</div>
            </section>
        </main>

        <footer class="footer">
            <div> &copy; 2026 battleship-clone.xyz </div>
            <div>|</div>
            <a href="https://github.com/jauharfz/battleship/" target="_blank">Github</a>
            <div>|</div>
            <a href="https://status.battleship-clone.xyz">Status</a>
        </footer>
    </body>
    <script type="module" src="/src/app.ts"></script>
</html>
